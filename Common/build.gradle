import de.markusbordihn.wickedhands.gradle.GenerateLifelessTexturesTask

plugins {
  id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT'
}

base {
  archivesName = "${mod_name}-common-${minecraft_version}"
}

minecraft {
  version(project.minecraft_version)
}

sourceSets {
  gameTest {
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
  }
}
dependencies {
  compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.7'

  // Easy NPC API (provided at runtime by the installed mod).
  def easyNpcApi = easyNpcApiArtifact()
  if (easyNpcApi != null) {
    compileOnly easyNpcApi
    testCompileOnly easyNpcApi
    testRuntimeOnly easyNpcApi
  }
  def easyModelEntitiesApi = easyModelEntitiesApiArtifact()
  if (easyModelEntitiesApi != null) {
    compileOnly(easyModelEntitiesApi) { transitive = false }
    testCompileOnly(easyModelEntitiesApi) { transitive = false }
    testRuntimeOnly(easyModelEntitiesApi) { transitive = false }
  }
  testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
  testImplementation 'org.mockito:mockito-core:5.20.0'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
  useJUnitPlatform()
}

def generateLifelessTextures = tasks.register('generateLifelessTextures', GenerateLifelessTexturesTask) {
  group = 'build'
  description = 'Derives the pale lifeless hand textures from the entity textures.'
  textureDirectory = file('src/main/resources/assets/wicked_hands/textures')
  // The rotten hand keeps its hand-painted lifeless texture.
  handTypes = ['drowned', 'bone']
}

sourceSets.main.resources.srcDirs = [files('src/main/resources').builtBy(generateLifelessTextures)]

processResources {
  inputs.property "version", project.version

  filesMatching(['pack.mcmeta']) {
    expand "version": project.version
  }
}

