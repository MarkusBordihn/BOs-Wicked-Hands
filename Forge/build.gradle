plugins {
  id 'maven-publish'
  id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
  id 'org.spongepowered.mixin' version '0.7.38'
  id 'net.darkhax.curseforgegradle' version '1.1.28'
  id 'nu.studer.credentials' version '3.0'
  id "com.modrinth.minotaur" version "2.+"
}

base {
  archivesName = "${mod_id}-forge-${minecraft_version}"
}

sourceSets {
  gameTest {
    java.srcDir project(":Common").file('src/gameTest/java')
    resources.srcDir project(":Common").file('src/gameTest/resources')
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
  }
}

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

minecraft {
  mappings channel: 'official', version: "${project.minecraft_version}"

  copyIdeResources = true

  // Run configurations
  runs {

    configureEach {
      property 'forge.logging.console.level', 'debug'
      property 'mixin.env.remapRefMap', 'true'
      property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

      mods {
        "${project.mod_id}" {
          source sourceSets.main
        }
      }
    }

    client {
      workingDirectory project.file('run/client')
    }

    if (clientTestToolkitAvailable) {
      clientTest {
        parent minecraft.runs.client
        workingDirectory project.file('run/clienttest')
      }
    }

    server {
      workingDirectory project.file('run/server')
      args '--nogui'
    }

    gameTestServer {
      workingDirectory project.file('run/gametest')
      property 'forge.enabledGameTestNamespaces', project.mod_id

      mods {
        "${project.mod_id}_gametest" {
          source sourceSets.gameTest
        }
      }
    }
  }
}

repositories {
  maven {
    name = 'Forge'
    url = 'https://maven.minecraftforge.net'
  }
  exclusiveContent {
    forRepository {
      maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public'
      }
    }
    filter {
      includeGroupAndSubgroups('org.spongepowered')
    }
  }
}

dependencies {
  minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

  annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

  // Include Common code
  compileOnly project(":Common")

  // Provided by the installed mod at runtime; testCompileOnly because Common joins every compile.
  def easyNpcApi = easyNpcApiArtifact()
  if (easyNpcApi != null) {
    compileOnly easyNpcApi
    testCompileOnly easyNpcApi
  }

  // No transitives (they describe the upstream dev env); compile scope for EasyModelNPCRenderer.
  def easyNpcForge = easyNpcArtifact('forge')
  if (easyNpcForge != null) {
    compileOnly(fg.deobf(easyNpcForge)) { transitive = false }
    runtimeOnly(fg.deobf(easyNpcForge)) { transitive = false }
  }

  def easyModelEntitiesForge = easyModelEntitiesArtifact('forge')
  if (easyModelEntitiesForge != null) {
    compileOnly(fg.deobf(easyModelEntitiesForge)) { transitive = false }
    testCompileOnly(easyModelEntitiesForge) { transitive = false }
    runtimeOnly(fg.deobf(easyModelEntitiesForge)) { transitive = false }
  }

  // Hack fix for now, force jopt-simple to be exactly 5.0.4 because Mojang ships that version, but some transitive dependencies request 6.0+
  implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

mixin {
  config "${mod_id}.forge.mixins.json"

  add sourceSets.main, "${mod_id}.refmap.json"
}

// MixinGradle 0.7.38 does not order the reobf configure task after compileJava, so @Shadow members
// stay unmapped on clean builds.
tasks.matching { task -> task.name.startsWith('configureReobfTaskFor') }.configureEach {
  dependsOn 'compileJava'
}

// The game test source set compiles against the main output, so the Common main sources would be
// compiled into it a second time.
tasks.withType(JavaCompile).matching { it.name != 'compileGameTestJava' }.configureEach {
  source(project(":Common").sourceSets.main.allSource)
}

processResources {
  from project(":Common").sourceSets.main.resources
  def minecraftVersionParts = project.minecraft_version.tokenize('.')
  def javaVersion = project.extensions
      .getByType(org.gradle.api.plugins.JavaPluginExtension)
      .toolchain
      .languageVersion
      .get()
      .asInt()
  def replaceProperties = [
      file                      : [jarVersion: '${file.jarVersion}'],
      forge_loader_version_range: "[${project.forge_version.tokenize('.')[0]},)",
      forge_version_range       : "[${project.forge_version},)",
      minecraft_version_range   : "[${project.minecraft_version},${minecraftVersionParts[0]}.${(minecraftVersionParts[1] as int) + 1})",
      java_version_range        : "[${javaVersion},)"
  ]
  inputs.properties replaceProperties

  filesMatching("META-INF/mods.toml") {
    expand replaceProperties
  }
}

// Example for how to get properties into the manifest for reading by the runtime..
jar {
  manifest {
    attributes([
        "Specification-Title"     : "${project.mod_name}",
        "Specification-Vendor"    : "${project.vendor_name}",
        "Specification-Version"   : "1", // We are version 1 of ourselves
        "Implementation-Title"    : project.name,
        "Implementation-Version"  : "${project.version}",
        "Implementation-Vendor"   : "${project.mod_author}",
        "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        "MixinConfigs"            : "${mod_id}.forge.mixins.json"
    ])
  }

  finalizedBy 'reobfJar'
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId project.group
      artifactId base.archivesName.get()
      version project.version
      artifact jar
    }
  }
}

// Merge the resources and classes into the same directory, because Java expects modules to be in a single directory.
// And if we have it in multiple we have to do performance intensive hacks like having the UnionFileSystem
// This will eventually be migrated to ForgeGradle so modders don't need to manually do it. But that is later.
sourceSets.each {
  def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
  it.output.resourcesDir = dir
  it.java.destinationDirectory = dir
}

// CurseForge Publishing
if (project.hasProperty('curseforge_project_id') && project.curseforge_project_id) {
  tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads to CurseForge'
    apiToken = "${credentials.forKey('curseforge_api_token')}"

    def mainFile = upload(project.curseforge_project_id, jar)
    mainFile.changelogType = 'markdown'
    mainFile.changelog = rootProject.file("CHANGELOG.md").text
    mainFile.releaseType = project.curseforge_release_type
    mainFile.addEnvironment("Client", "Server")
    mainFile.addModLoader('Forge')
    mainFile.addGameVersion(project.minecraft_version)
    mainFile.addRequirement('easy-npc-core')
    mainFile.addRequirement('easy-model-entities')
  }
}

// Modrinth Publishing
if (project.hasProperty('modrinth_project_id') && project.modrinth_project_id) {
  modrinth {
    token = "${credentials.forKey('modrinth_api_token')}"
    projectId = "${project.modrinth_project_id}"
    versionNumber = "${project.version}"
    versionType = "${project.modrinth_release_type}"
    versionName = "${project.mod_name} ${project.version}"
    changelog = rootProject.file("CHANGELOG.md").text
    uploadFile = jar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ["forge"]
    dependencies {
      required.project "easy-npc-core"
      required.project "easy-model-entities"
    }
  }
}
