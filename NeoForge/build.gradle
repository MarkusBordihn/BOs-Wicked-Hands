plugins {
  id 'maven-publish'
  id 'net.neoforged.gradle.userdev' version '7.0.190'
  id 'net.darkhax.curseforgegradle' version '1.1.28'
  id 'nu.studer.credentials' version '3.0'
  id "com.modrinth.minotaur" version "2.+"
}

base {
  archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

sourceSets {
  gameTest {
    java.srcDir project(":Common").file('src/gameTest/java')
    resources.srcDir project(":Common").file('src/gameTest/resources')
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
  }
}

runs {
  configureEach {
    systemProperty 'forge.logging.markers', 'REGISTRIES'
    systemProperty 'forge.logging.console.level', 'debug'
    modSource project.sourceSets.main
  }

  client {
    workingDirectory project.file('run/client')
  }

  client2 {
    runType('client')
    workingDirectory project.file('run/client2')
    arguments.addAll '--username', 'guest_player'
  }

  server {
    workingDirectory project.file('run/server')
    arguments.add '--nogui'
  }

  gameTestServer {
    workingDirectory project.file('run/gametest')
    systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    modSources.add('wicked_hands_gametest', project.sourceSets.gameTest)
  }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
  implementation "net.neoforged:neoforge:${neoforge_version}"

  compileOnly project(":Common")

  def easyNpcApi = easyNpcApiArtifact()
  if (easyNpcApi != null) {
    compileOnly easyNpcApi
  }

  // No transitives (they describe the upstream dev env); compile scope for EasyModelNPCRenderer.
  def easyNpcNeoForge = easyNpcArtifact('neoforge')
  if (easyNpcNeoForge != null) {
    compileOnly(easyNpcNeoForge) { transitive = false }
    runtimeOnly(easyNpcNeoForge) { transitive = false }
  }

  def easyModelEntitiesNeoForge = easyModelEntitiesArtifact('neoforge')
  if (easyModelEntitiesNeoForge != null) {
    compileOnly(easyModelEntitiesNeoForge) { transitive = false }
    runtimeOnly(easyModelEntitiesNeoForge) { transitive = false }
  }
}

// NeoGradle compiles the game, but we don't want to add our common code to the game's code.
Spec<Task> notNeoTask = { Task it -> !it.name.startsWith("neo") && !it.name.contains("Test") } as Spec<Task>

tasks.withType(JavaCompile).matching(notNeoTask).configureEach {
  source(project(":Common").sourceSets.main.allSource)
}

tasks.withType(Javadoc).matching(notNeoTask).configureEach {
  source(project(":Common").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
  from(project(":Common").sourceSets.main.allSource)
}

tasks.withType(ProcessResources).matching(notNeoTask).configureEach {
  from project(":Common").sourceSets.main.resources
  def minecraftVersionParts = project.minecraft_version.tokenize('.')
  def replaceProperties = [
      file                   : [jarVersion: '${file.jarVersion}'],
      neoforge_version_range : "[${project.neoforge_version},)",
      minecraft_version_range: "[${project.minecraft_version},${minecraftVersionParts[0]}.${(minecraftVersionParts[1] as int) + 1})"
  ]
  inputs.properties replaceProperties

  filesMatching("META-INF/neoforge.mods.toml") {
    expand replaceProperties
  }
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId project.group
      artifactId base.archivesName.get()
      version project.version
      artifact jar
    }
  }
}

// CurseForge Publishing
if (project.hasProperty('curseforge_project_id') && project.curseforge_project_id) {
  tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads to CurseForge'
    apiToken = "${credentials.forKey('curseforge_api_token')}"

    def mainFile = upload(project.curseforge_project_id, jar)
    mainFile.changelogType = 'markdown'
    mainFile.changelog = rootProject.file("CHANGELOG.md").text
    mainFile.releaseType = "${project.curseforge_release_type}"
    mainFile.addEnvironment("Client", "Server")
    mainFile.addModLoader('NeoForge')
    mainFile.addGameVersion("${project.minecraft_version}")
    mainFile.addRequirement('easy-npc-core')
    mainFile.addRequirement('easy-model-entities')
  }
}

// Modrinth Publishing
if (project.hasProperty('modrinth_project_id') && project.modrinth_project_id) {
  modrinth {
    token = "${credentials.forKey('modrinth_api_token')}"
    projectId = "${project.modrinth_project_id}"
    versionNumber = "${project.version}"
    versionType = "${project.modrinth_release_type}"
    versionName = "${project.mod_name} ${project.version}"
    changelog = rootProject.file("CHANGELOG.md").text
    uploadFile = jar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ["neoforge"]
    dependencies {
      required.project "easy-npc-core"
      required.project "easy-model-entities"
    }
  }
}

jar {
  manifest {
    attributes([
        "Specification-Title"     : "${project.mod_name}",
        "Specification-Vendor"    : "${project.vendor_name}",
        "Specification-Version"   : "${project.version}",
        "Implementation-Title"    : "${project.mod_name}",
        "Implementation-Version"  : "${project.version}",
        "Implementation-Vendor"   : "${project.mod_author}",
        "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
    ])
  }
}

test {
  useJUnitPlatform()
}
