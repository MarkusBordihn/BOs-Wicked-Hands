plugins {
  id 'idea'
  id "org.jetbrains.gradle.plugin.idea-ext" version "1.3"
}

def ghostRefScript = file(findProperty('ghostRefIndex') ?: '')
if (ghostRefScript.exists()) apply from: ghostRefScript

tasks.register('allGameTests') {
  group = 'verification'
  description = 'Runs Fabric, Forge and NeoForge game tests.'
  dependsOn ':Fabric:runGameTest', ':Forge:runGameTestServer', ':NeoForge:runGameTestServer'
}

tasks.register('fullCheck') {
  group = 'verification'
  description = 'Runs the standard checks and Fabric, Forge and NeoForge game tests.'
  dependsOn ':Common:check', ':Fabric:check', ':Forge:check', ':NeoForge:check', 'allGameTests'
}

tasks.register('publishModrinth') {
  group = 'publishing'
  description = 'Publishes Forge, NeoForge and Fabric to Modrinth.'
  dependsOn ':Forge:modrinth', ':NeoForge:modrinth', ':Fabric:modrinth'
  mustRunAfter 'fullCheck'
}

tasks.register('publishDelay') {
  description = 'Pauses between Modrinth and CurseForge uploads so logs do not interfere.'
  mustRunAfter 'publishModrinth'
  doLast {
    println 'Waiting 5 seconds before CurseForge upload...'
    sleep(5000)
  }
}

tasks.register('publishCurseForge') {
  group = 'publishing'
  description = 'Publishes Forge, NeoForge and Fabric to CurseForge.'
  dependsOn ':Forge:curseforge', ':NeoForge:curseforge', ':Fabric:curseforge'
  mustRunAfter 'publishDelay'
}

tasks.register('publishMods') {
  group = 'publishing'
  description = 'Builds, runs full checks, then publishes to Modrinth and (after a 5s pause) CurseForge.'
  dependsOn 'fullCheck', 'publishModrinth', 'publishDelay', 'publishCurseForge'
}

subprojects {

  apply plugin: 'java'

  java.toolchain.languageVersion = JavaLanguageVersion.of(25)
  java.withSourcesJar()
  java.withJavadocJar()

  repositories {
    mavenCentral()
    mavenLocal {
      content {
        includeGroup "de.markusbordihn.easynpc"
        includeGroup "de.markusbordihn.easymodelentities"
      }
    }
    maven {
      url "https://www.cursemaven.com"
      content {
        includeGroup "curse.maven"
      }
    }
    maven {
      url = uri("https://api.modrinth.com/maven")
      content {
        includeGroup "maven.modrinth"
      }
    }
  }

  // Integration mods resolve from Maven Local first and fall back to the Modrinth release.
  ext.EASY_NPC_MODRINTH_PROJECT = 'easy-npc-core'
  ext.EASY_MODEL_ENTITIES_MODRINTH_PROJECT = 'easy-model-entities'

  ext.mavenLocalArtifact = { String group, String artifact, Object version ->
    if (!version) {
      return null
    }

    def jar = file("${System.getProperty('user.home')}/.m2/repository/"
        + "${group.replace('.', '/')}/${artifact}/${version}/${artifact}-${version}.jar")
    return jar.exists() ? "${group}:${artifact}:${version}" : null
  }

  // Modrinth publishes one version per loader, so both filters are required to stay deterministic.
  ext.modrinthArtifact = { String modrinthProject, Object version, String loader ->
    return version
        ? "maven.modrinth:${modrinthProject}:${version}-${loader},${project.minecraft_version}"
        : null
  }

  // No loader independent artifact exists, so the API falls back to the Fabric jar.
  ext.easyNpcApiArtifact = { ->
    mavenLocalArtifact('de.markusbordihn.easynpc',
        "easy_npc-common-${project.minecraft_version}", project.findProperty('easy_npc_version'))
        ?: modrinthArtifact(EASY_NPC_MODRINTH_PROJECT,
            project.findProperty('easy_npc_version'), 'fabric')
  }

  ext.easyNpcArtifact = { String loader ->
    mavenLocalArtifact('de.markusbordihn.easynpc',
        "easy_npc-${loader}-${project.minecraft_version}", project.findProperty('easy_npc_version'))
        ?: modrinthArtifact(EASY_NPC_MODRINTH_PROJECT,
            project.findProperty('easy_npc_version'), loader)
  }

  ext.easyModelEntitiesArtifact = { String loader ->
    mavenLocalArtifact('de.markusbordihn.easymodelentities',
        "easy_model_entities-${loader}-${project.minecraft_version}",
        project.findProperty('easy_model_entities_version'))
        ?: modrinthArtifact(EASY_MODEL_ENTITIES_MODRINTH_PROJECT,
            project.findProperty('easy_model_entities_version'), loader)
  }

  dependencies {
    configurations.configureEach {
      resolutionStrategy.force 'org.ow2.asm:asm:9.8'
      resolutionStrategy.force 'org.ow2.asm:asm-commons:9.8'
    }
  }

  tasks.register('wrapper', Wrapper) {
    gradleVersion = '9.8.0'
    distributionType = Wrapper.DistributionType.BIN
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
  }

  tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
  }

  tasks.withType(Javadoc).configureEach {
    enabled = false
  }

  tasks.register("prepareKotlinBuildScriptModel") {}

  idea {
    module {
      downloadSources = true
      downloadJavadoc = true
    }
  }

  // The toolkit opens a control socket in the client, so it only joins the runtime of client tests.
  ext.isClientTestRun = gradle.startParameter.taskNames.any {
    return it.toLowerCase().contains('clienttest')
  }
}

apply from: 'gradle/tasks/clientTest.gradle'
